suite: calculated affinities
templates:
  - workload/deployment.yaml
tests:
  - it: emits no affinity by default
    asserts:
      - notExists:
          path: spec.template.spec.affinity

  - it: builds a soft pod anti-affinity selecting this release
    set:
      podAntiAffinityPreset: soft
    asserts:
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].podAffinityTerm.topologyKey
          value: kubernetes.io/hostname
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].podAffinityTerm.labelSelector.matchLabels["app.kubernetes.io/name"]
          value: RELEASE-NAME

  - it: builds a hard node affinity from the preset
    set:
      nodeAffinityPreset:
        type: hard
        key: kubernetes.io/arch
        values: [amd64]
    asserts:
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].key
          value: kubernetes.io/arch

  - it: honours a custom topology key
    set:
      podAffinityPreset: hard
      affinityTopologyKey: topology.kubernetes.io/zone
    asserts:
      - equal:
          path: spec.template.spec.affinity.podAffinity.requiredDuringSchedulingIgnoredDuringExecution[0].topologyKey
          value: topology.kubernetes.io/zone

  - it: lets raw affinity replace the presets outright
    set:
      podAntiAffinityPreset: hard
      nodeAffinityPreset:
        type: hard
        key: kubernetes.io/arch
        values: [amd64]
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: raw/only
                    operator: In
                    values: ["{{ .Release.Name }}"]
    asserts:
      - notExists:
          path: spec.template.spec.affinity.podAntiAffinity
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].key
          value: raw/only
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].values[0]
          value: RELEASE-NAME

  - it: tpl-renders preset values too
    set:
      nodeAffinityPreset:
        type: soft
        key: "{{ .Release.Name }}/zone"
        values: ["{{ .Release.Namespace }}-a"]
    asserts:
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].preference.matchExpressions[0].key
          value: RELEASE-NAME/zone
