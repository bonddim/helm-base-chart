########################################################################
### Security ###
########################################################################
serviceAccount:
  # -- Whether to create a ServiceAccount resource.
  # @section -- Security parameters
  create: false
  # -- Annotations for the ServiceAccount.
  # @section -- Security parameters
  annotations: {}
  # -- (bool) Automatically mount API credentials.
  # @section -- Security parameters
  automount: null
  # -- Name of the ServiceAccount. Auto-generated from fullname if empty and create=true.
  # @section -- Security parameters
  name: ""

rbac:
  # -- Whether to create a Role and RoleBinding for the ServiceAccount.
  # @section -- Security parameters
  create: false
  # -- Annotations for the Role and RoleBinding.
  # @section -- Security parameters
  annotations: {}
  # -- Labels for the Role and RoleBinding.
  # @section -- Security parameters
  labels: {}
  # -- Policy rules for the Role (tpl-rendered), e.g. `[{ apiGroups: [""], resources: [pods], verbs: [get, list] }]`.
  # @section -- Security parameters
  rules: []

########################################################################
### Network ###
########################################################################
service:
  # -- Whether to create a Service resource.
  # @section -- Network parameters
  enabled: false
  # -- Annotations for the Service.
  # @section -- Network parameters
  annotations: {}
  # -- Service type.
  # @section -- Network parameters
  type: ClusterIP
  # -- (int) Primary port exposed by the Service (also used as the container's primary port).
  # @section -- Network parameters
  port: null
  # -- Target port on the container. Defaults to the port name "http".
  # @section -- Network parameters
  targetPort: http
  # -- Protocol for the primary port.
  # @section -- Network parameters
  protocol: TCP
  # -- NodePort value (only applies to NodePort/LoadBalancer service types).
  # @section -- Network parameters
  nodePort: null
  # -- Extra ports  Key is the port name.
  # @section -- Network parameters
  extraPorts: {}
  # -- Headless Service, exposing each pod under its own DNS name. Required for stable per-pod DNS with workload=statefulset.
  # @section -- Network parameters
  headless:
    enabled: false
    annotations: {}
    labels: {}
    publishNotReadyAddresses: true

ingress:
  # -- Whether to create an Ingress resource.
  # @section -- Network parameters
  enabled: false
  # -- Annotations for the Ingress.
  # @section -- Network parameters
  annotations: {}
  # -- Ingress class name.
  # @section -- Network parameters
  className: ""
  # -- List of hostnames to route traffic to this service.
  # @section -- Network parameters
  hostnames: []
  # -- Path rules applied to every hostname.
  # @section -- Network parameters
  paths:
    - path: /
      pathType: Prefix
  # -- TLS configuration.
  # @section -- Network parameters
  tls:
    enabled: false
    # -- Secret name; defaults to "<first-hostname>-tls" when empty.
    # @section -- Network parameters
    secretName: ""

########################################################################
### HTTPRoute (Gateway API) ###
########################################################################
httpRoute:
  # -- Whether to create an HTTPRoute resource.
  # @section -- Network parameters
  enabled: false
  # -- Annotations for the HTTPRoute.
  # @section -- Network parameters
  annotations: {}
  # -- Gateway parentRefs this route attaches to.
  # @section -- Network parameters
  parentRefs: []
  # -- Hostnames matched by this route.
  # @section -- Network parameters
  hostnames: []
  # -- Routing rules. backendRefs are auto-populated from the Service.
  # @section -- Network parameters
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

########################################################################
### NetworkPolicy ###
########################################################################
networkPolicy:
  # -- Whether to create a NetworkPolicy resource.
  # @section -- Network parameters
  enabled: false
  # -- Annotations for the NetworkPolicy.
  # @section -- Network parameters
  annotations: {}
  # -- Labels for the NetworkPolicy.
  # @section -- Network parameters
  labels: {}
  # -- Pods this policy applies to. Defaults to this release's selector labels when empty.
  # @section -- Network parameters
  podSelector: {}
  # -- (list) Policy types to enforce, e.g. [Ingress, Egress]. Listing a type without
  # matching rules below denies all traffic of that type.
  # @section -- Network parameters
  policyTypes: []
  # -- (list) Ingress rules, passed through to the NetworkPolicy spec (tpl-rendered).
  # @section -- Network parameters
  ingress: []
  # -- (list) Egress rules, passed through to the NetworkPolicy spec (tpl-rendered).
  # @section -- Network parameters
  egress: []

########################################################################
### Horizontal Pod Autoscaling ###
########################################################################
autoscaling:
  # -- Whether to create an HPA resource. Rejected with workload=daemonset, and with an active VPA (see vpa.updatePolicy).
  # @section -- Horizontal Pod Autoscaling parameters
  enabled: false
  # -- Annotations for the HPA.
  # @section -- Horizontal Pod Autoscaling parameters
  annotations: {}
  # -- Labels for the HPA.
  # @section -- Horizontal Pod Autoscaling parameters
  labels: {}
  # -- Minimum number of replicas when autoscaling is enabled.
  # @section -- Horizontal Pod Autoscaling parameters
  minReplicas: 1
  # -- Maximum number of replicas when autoscaling is enabled.
  # @section -- Horizontal Pod Autoscaling parameters
  maxReplicas: 10
  # -- Target CPU utilization percentage.
  # @section -- Horizontal Pod Autoscaling parameters
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80
  # -- Advanced scaling behavior.
  # @section -- Horizontal Pod Autoscaling parameters
  behavior: {}
  # -- Additional custom metrics (appended to the generated metrics list).
  # @section -- Horizontal Pod Autoscaling parameters
  metrics: []

########################################################################
### Vertical Pod Autoscaling ###
########################################################################
vpa:
  # -- Whether to create a VerticalPodAutoscaler resource. Requires the VPA controller in the cluster.
  # @section -- Vertical Pod Autoscaler parameters
  enabled: false
  # -- Annotations for the VerticalPodAutoscaler.
  # @section -- Vertical Pod Autoscaler parameters
  annotations: {}
  # -- Labels for the VerticalPodAutoscaler.
  # @section -- Vertical Pod Autoscaler parameters
  labels: {}
  # -- How the VPA applies its recommendations, e.g. `{ updateMode: Auto, minReplicas: 2 }`. Defaults to recommendation-only. Any mode other than `Off` is rejected when autoscaling.enabled=true, since both controllers would fight over the same pods. Note `Off` must stay quoted, or YAML parses it as false.
  # @section -- Vertical Pod Autoscaler parameters
  updatePolicy:
    updateMode: "Off"
  # -- Per-container bounds on the recommendation, e.g. `{ containerPolicies: [{ containerName: "*", minAllowed: { cpu: 10m } }] }`.
  # @section -- Vertical Pod Autoscaler parameters
  resourcePolicy: {}
  # -- (object/list) Alternative recommenders to use instead of the default one, e.g. `[{ name: custom-recommender }]`.
  # @section -- Vertical Pod Autoscaler parameters
  recommenders: []

########################################################################
### Pod Disruption Budget ###
########################################################################
podDisruptionBudget:
  # -- Whether to create a PodDisruptionBudget resource.
  # @section -- Pod Disruption Budget parameters
  enabled: false
  # -- Annotations for the PodDisruptionBudget.
  # @section -- Pod Disruption Budget parameters
  annotations: {}
  # -- Labels for the PodDisruptionBudget.
  # @section -- Pod Disruption Budget parameters
  labels: {}
  # -- (int/string) Minimum number or percentage of pods that must stay available.
  # Mutually exclusive with maxUnavailable - set this to null to use maxUnavailable.
  # @section -- Pod Disruption Budget parameters
  minAvailable: 1
  # -- (int/string) Maximum number or percentage of pods that may be unavailable.
  # Mutually exclusive with minAvailable.
  # @section -- Pod Disruption Budget parameters
  maxUnavailable: null
  # -- (string) How unhealthy pods are counted during eviction: IfHealthyBudget or AlwaysAllow.
  # @section -- Pod Disruption Budget parameters
  unhealthyPodEvictionPolicy: null

########################################################################
### Storage ###
########################################################################
persistence:
  # -- Whether to create a PersistentVolumeClaim.
  # @section -- Storage parameters
  enabled: false
  # -- Annotations for the PersistentVolumeClaim.
  # @section -- Storage parameters
  annotations: {}
  # -- Labels for the PersistentVolumeClaim.
  # @section -- Storage parameters
  labels: {}
  # -- Access modes for the volume.
  # @section -- Storage parameters
  accessModes:
    - ReadWriteOnce
  # -- Requested size of the volume.
  # @section -- Storage parameters
  size: 8Gi
  # -- (string) StorageClass to use. Empty uses the cluster default; set to "-" to disable dynamic provisioning.
  # @section -- Storage parameters
  storageClassName: ""
  # -- (string) Volume mode: Filesystem or Block.
  # @section -- Storage parameters
  volumeMode: ""
  # -- (string) Bind to a specific PersistentVolume by name.
  # @section -- Storage parameters
  volumeName: ""
  # -- Label selector to bind an existing volume.
  # @section -- Storage parameters
  selector: {}
  # -- Source to populate the volume from, e.g. a snapshot.
  # @section -- Storage parameters
  dataSource: {}

