########################################################################
### Global Parameters ###
########################################################################
global:
  # -- Global image registry. Used as the default for all charts, but can be overridden by individual chart values.
  # @section -- Global parameters
  imageRegistry: ""
  # -- Global image tag used as the default for all charts. Can be overridden by individual chart values.
  # @section -- Global parameters
  imageTag: ""

########################################################################
### Common Parameters ###
########################################################################
# -- Override resource names (partially)
# @section -- Common parameters
nameOverride: ""
# -- Override resource names (fully)
# @section -- Common parameters
fullnameOverride: ""

########################################################################
### Common Metadata ###
########################################################################
# -- Labels to add to all deployed resources
# @section -- Common parameters
commonLabels: {}
# -- Annotations to add to all deployed resources
# @section -- Common parameters
commonAnnotations: {}

########################################################################
### Workload ###
########################################################################
# -- Workload type to deploy. One of: deployment, daemonset, statefulset, rollout, job, cronjob, pod or null
# @section -- Workload parameters
workload: deployment
# -- Additional annotations on the Workload resource itself.
# @section -- Workload parameters
annotations: {}
# -- Additional labels on the Deployment resource itself.
# @section -- Workload parameters
labels: {}
# -- (int) Number of pod replicas. Ignored when autoscaling.enabled=true.
# Must be >= 0 if specified. null by default, which defaults to 1 and not controlled by Helm.
# @section -- Workload parameters
replicas: null
# -- Update strategy for the selected workload. e.g. { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }.
# For workload=rollout, the chart merges Service references into this strategy: `stableService`/`activeService`.
# @section -- Workload parameters
strategy: {}
# -- (string) StatefulSet service name. Defaults to the fullname when empty.
# @section -- Workload parameters
serviceName: ""
# -- (string) StatefulSet pod management policy: OrderedReady or Parallel.
# @section -- Workload parameters
podManagementPolicy: ""
# -- StatefulSet volumeClaimTemplates for persistent storage.
# @section -- Workload parameters
volumeClaimTemplates: []
# -- StatefulSet persistentVolumeClaimRetentionPolicy.
# @section -- Workload parameters
persistentVolumeClaimRetentionPolicy: {}
# -- (int) Number of old ReplicaSets to retain.
# @section -- Workload parameters
revisionHistoryLimit: null

########################################################################
### Job / CronJob ###
########################################################################
# Job parameters. Applicable when workload=job, and to the jobTemplate when workload=cronjob.
job:
  # -- (int) Number of retries before marking the Job failed.
  # @section -- Job parameters
  backoffLimit: null
  # -- (int) Number of successful completions required.
  # @section -- Job parameters
  completions: null
  # -- (string) Completion mode: NonIndexed or Indexed.
  # @section -- Job parameters
  completionMode: ""
  # -- (int) Number of pods to run in parallel.
  # @section -- Job parameters
  parallelism: null
  # -- (int) Seconds the Job may run before it is terminated.
  # @section -- Job parameters
  activeDeadlineSeconds: null
  # -- (int) Seconds after finishing before the Job is eligible for automatic deletion.
  # @section -- Job parameters
  ttlSecondsAfterFinished: null
  # -- (bool) Suspend the Job without deleting it.
  # @section -- Job parameters
  suspend: null
  # -- Rules for handling specific container exit codes, e.g. `{ rules: [...] }`.
  # @section -- Job parameters
  podFailurePolicy: {}

# CronJob parameters. Only applicable when workload=cronjob.
cronJob:
  # -- (string) Cron schedule in standard cron format (tpl-rendered).
  # @section -- CronJob parameters
  schedule: "0 * * * *"
  # -- (string) Time zone the schedule is interpreted in, e.g. Europe/Kyiv. Requires Kubernetes 1.27+.
  # @section -- CronJob parameters
  timeZone: ""
  # -- (string) How to treat concurrent executions: Allow, Forbid or Replace.
  # @section -- CronJob parameters
  concurrencyPolicy: ""
  # -- (int) Seconds by which a missed schedule may still be started.
  # @section -- CronJob parameters
  startingDeadlineSeconds: null
  # -- (bool) Suspend subsequent executions.
  # @section -- CronJob parameters
  suspend: null
  # -- (int) Number of successful finished Jobs to retain.
  # @section -- CronJob parameters
  successfulJobsHistoryLimit: null
  # -- (int) Number of failed finished Jobs to retain.
  # @section -- CronJob parameters
  failedJobsHistoryLimit: null

# Argo Rollouts parameters. Only applicable when workload=rollout.
# Full field reference:
# https://argo-rollouts.readthedocs.io/en/stable/features/specification/
rollout:
  # -- Analysis run history limits, e.g. `{ successfulRunHistoryLimit: 5, unsuccessfulRunHistoryLimit: 5 }`. [Rollout Specification](https://argo-rollouts.readthedocs.io/en/stable/features/specification/)
  # @section -- Rollout parameters (`workload=rollout`)
  analysis: {}
  # -- Minimum seconds a new pod must be ready, with no container crashing, before it counts as available. 0 means available as soon as it is ready.
  # @section -- Rollout parameters (`workload=rollout`)
  minReadySeconds: 0
  # -- (bool) Manually pause the rollout, halting its steps while HPA autoscaling continues. Normally set via tooling (`kubectl argo rollouts pause`) rather than here. If true at creation, replicas do not scale up from zero until manually promoted.
  # @section -- Rollout parameters (`workload=rollout`)
  paused: null
  # -- (int) Seconds to wait for the rollout to make progress before reporting a failure.
  # @section -- Rollout parameters (`workload=rollout`)
  progressDeadlineSeconds: 600
  # -- (bool) Whether to abort the update when progressDeadlineSeconds is exceeded. Defaults to false.
  # @section -- Rollout parameters (`workload=rollout`)
  progressDeadlineAbort: null
  # -- Fast-track redeploys of a recently rolled-back revision, e.g. `{ revisions: 3 }`. Unset by default.
  # @section -- Rollout parameters (`workload=rollout`)
  rollbackWindow: {}

########################################################################
### Pod Parameters ###
########################################################################
# -- Additional annotations on the Pod template.
# @section -- Workload parameters
podAnnotations: {}
# -- Additional labels on the Pod template.
# @section -- Workload parameters
podLabels: {}
# -- Pod-level security context.
# @section -- Workload parameters
podSecurityContext: {}
# -- Image pull secrets (list of { name: ... }).
# @section -- Workload parameters
imagePullSecrets: []
# -- (bool) Whether to auto-mount the service account token to the pod.
# @section -- Workload parameters
automountServiceAccountToken: null
# -- (object/list) Init containers (values are tpl-rendered).
# @section -- Workload parameters
initContainers: {}
# -- (object/list) Sidecar containers (values are tpl-rendered).
# @section -- Workload parameters
sidecarContainers: {}
# -- (object/list) Volumes (values are tpl-rendered).
# @section -- Workload parameters
volumes: {}
# -- Node selector for pod scheduling.
# @section -- Workload parameters
nodeSelector: {}
# -- Tolerations for pod scheduling.
# @section -- Workload parameters
tolerations: []
# -- Raw pod affinity/anti-affinity rules (tpl-rendered). When set, this replaces the calculated presets below entirely.
# @section -- Workload parameters
affinity: {}
# -- (string) Calculated pod affinity preset: `soft`, `hard`, or empty to disable. Co-locates replicas of this release.
# @section -- Workload parameters
podAffinityPreset: ""
# -- (string) Calculated pod anti-affinity preset: `soft`, `hard`, or empty to disable. Spreads replicas of this release apart.
# @section -- Workload parameters
podAntiAffinityPreset: ""
# -- Calculated node affinity preset, e.g. `{ type: soft, key: topology.kubernetes.io/zone, values: [eu-central-1a] }`. Requires both type (`soft`/`hard`) and key.
# @section -- Workload parameters
nodeAffinityPreset:
  type: ""
  key: ""
  values: []
# -- (string) Topology key used by the pod affinity/anti-affinity presets. Defaults to kubernetes.io/hostname.
# @section -- Workload parameters
affinityTopologyKey: ""
# -- Topology spread constraints.
# @section -- Workload parameters
topologySpreadConstraints: []
# -- (string) Pod restart policy. Defaults to Never for job/cronjob workloads, and to the cluster default otherwise.
# @section -- Workload parameters
restartPolicy: ""
# -- DNS policy for the pod.
# @section -- Workload parameters
dnsPolicy: ""
# -- Priority class name.
# @section -- Workload parameters
priorityClassName: ""
# -- (int) Grace period (seconds) before forceful termination.
# @section -- Workload parameters
terminationGracePeriodSeconds: null
# -- (bool) Enable Kubernetes service links injected as env vars.
# @section -- Workload parameters
enableServiceLinks: null

