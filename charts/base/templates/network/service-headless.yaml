{{- if .Values.service.headless.enabled -}}
apiVersion: v1
kind: Service
metadata:
  {{- with include "base.annotations" (dict "annotations" .Values.service.headless.annotations "context" $) }}
  annotations: {{- . | nindent 4 }}
  {{- end }}
  labels: {{- include "base.labels" (dict "labels" .Values.service.headless.labels "context" .) | nindent 4 }}
  name: {{ include "base.headlessServiceName" . }}
spec:
  clusterIP: None
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: {{ .Values.service.protocol }}
    {{- with .Values.service.extraPorts }}
    {{- include "base.render.list" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
  {{- with .Values.service.headless.publishNotReadyAddresses }}
  publishNotReadyAddresses: {{ . }}
  {{- end }}
  selector: {{- include "base.selectorLabels" . | nindent 4 }}
  type: ClusterIP
{{- end }}
