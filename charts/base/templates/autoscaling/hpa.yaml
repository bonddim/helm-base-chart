{{- if .Values.autoscaling.enabled -}}
{{- if has .Values.workload (list "daemonset" "job" "cronjob" "scaledjob") }}
{{- fail (printf "autoscaling: a HorizontalPodAutoscaler cannot scale workload=%s (set autoscaling.enabled=false, or pick a scalable workload)" .Values.workload) }}
{{- end }}
{{- $vpaUpdateMode := dig "updateMode" "Auto" (default dict .Values.vpa.updatePolicy) }}
{{- if and .Values.vpa.enabled (ne $vpaUpdateMode "Off") }}
{{- fail (printf "autoscaling: HPA and VPA both enabled with vpa.updatePolicy.updateMode=%s - they would fight over the same pods (set vpa.updatePolicy.updateMode=Off to keep VPA recommendation-only, or disable one of them)" $vpaUpdateMode) }}
{{- end }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  {{- with include "base.annotations" (dict "annotations" .Values.autoscaling.annotations "context" $) }}
  annotations: {{- . | nindent 4 }}
  {{- end }}
  labels: {{- include "base.labels" (dict "labels" .Values.autoscaling.labels "context" .) | nindent 4 }}
  name: {{ include "base.fullname" . }}
spec:
  scaleTargetRef: {{- include "base.targetRef" . | nindent 4 }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    {{- with .Values.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
    {{- with .Values.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
    {{- with .Values.autoscaling.metrics }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.autoscaling.behavior }}
  behavior: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
