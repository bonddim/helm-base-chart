{{- if .Values.vpa.enabled -}}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  {{- with include "base.annotations" (dict "annotations" .Values.vpa.annotations "context" $) }}
  annotations: {{- . | nindent 4 }}
  {{- end }}
  labels: {{- include "base.labels" (dict "labels" .Values.vpa.labels "context" .) | nindent 4 }}
  name: {{ include "base.fullname" . }}
spec:
  targetRef: {{- include "base.targetRef" . | nindent 4 }}
  {{- with .Values.vpa.updatePolicy }}
  updatePolicy: {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.vpa.resourcePolicy }}
  resourcePolicy: {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.vpa.recommenders }}
  recommenders: {{- include "base.render.list" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
{{- end }}
