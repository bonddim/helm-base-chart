{{- if .Values.persistence.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  {{- with include "base.annotations" (dict "annotations" .Values.persistence.annotations "context" $) }}
  annotations: {{- . | nindent 4 }}
  {{- end }}
  labels: {{- include "base.labels" (dict "labels" .Values.persistence.labels "context" .) | nindent 4 }}
  name: {{ include "base.fullname" . }}
spec:
  accessModes: {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- if not (kindIs "invalid" .Values.persistence.storageClassName) }}
  {{- with .Values.persistence.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  {{- end }}
  {{- with .Values.persistence.volumeMode }}
  volumeMode: {{ . }}
  {{- end }}
  {{- with .Values.persistence.volumeName }}
  volumeName: {{ . }}
  {{- end }}
  {{- with .Values.persistence.selector }}
  selector: {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.persistence.dataSource }}
  dataSource: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
