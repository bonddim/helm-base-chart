{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  {{- with include "base.annotations" (dict "annotations" .Values.networkPolicy.annotations "context" .) }}
  annotations: {{- . | nindent 4 }}
  {{- end }}
  labels: {{- include "base.labels" (dict "labels" .Values.networkPolicy.labels "context" .) | nindent 4 }}
  name: {{ include "base.fullname" . }}
spec:
  podSelector:
    {{- if .Values.networkPolicy.podSelector }}
    {{- include "base.render.value" (dict "value" .Values.networkPolicy.podSelector "context" $) | nindent 4 }}
    {{- else }}
    matchLabels: {{- include "base.selectorLabels" . | nindent 6 }}
    {{- end }}
  {{- with .Values.networkPolicy.policyTypes }}
  policyTypes: {{- include "base.render.value" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
  {{- with .Values.networkPolicy.ingress }}
  ingress: {{- include "base.render.value" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
  {{- with .Values.networkPolicy.egress }}
  egress: {{- include "base.render.value" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
{{- end }}
